resolver 127.0.0.11 valid=30s;

server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name feiche.coderjc.cn;
    root /usr/share/nginx/client;

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/snippets/api.conf;
}

server {
    listen 80;
    server_name feiche-admin.coderjc.cn;
    root /usr/share/nginx/admin;

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/snippets/api.conf;
}
