server {
    listen 443 ssl;
    server_name feiche.coderjc.cn;

    ssl_certificate     /etc/letsencrypt/live/feiche.coderjc.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feiche.coderjc.cn/privkey.pem;

    location / {
        set $upstream_qqfeiche http://qqfeiche-nginx;
        proxy_pass $upstream_qqfeiche;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
