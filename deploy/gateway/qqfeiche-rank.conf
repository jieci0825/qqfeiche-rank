server {
    listen 80;
    server_name feiche-admin.coderjc.cn;

    location / {
        set $upstream_qqfeiche http://qqfeiche-nginx;
        proxy_pass $upstream_qqfeiche;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name feiche.coderjc.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://feiche.coderjc.cn$request_uri;
    }
}
