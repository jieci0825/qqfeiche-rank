name: qqfeiche-rank

services:
    qqfeiche-nginx:
        image: 'qqfeiche-rank-nginx:${RELEASE_TAG:?请设置 RELEASE_TAG}'
        pull_policy: never
        restart: unless-stopped
        depends_on:
            - qqfeiche-api
        networks:
            - default
            - gateway-net

    qqfeiche-api:
        image: 'qqfeiche-rank-api:${RELEASE_TAG:?请设置 RELEASE_TAG}'
        pull_policy: never
        restart: unless-stopped
        env_file: .env.production
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - >-
                    require('node:http').get('http://127.0.0.1:9433/api/health', response => {
                        response.resume(); process.exitCode = response.statusCode === 200 ? 0 : 1
                    }).on('error', () => { process.exitCode = 1 })
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 5s
        environment:
            NODE_ENV: production
            HOST: 0.0.0.0
            PORT: '9433'
            TRUST_PROXY: '1'
            ADMIN_ORIGIN: http://feiche-admin.coderjc.cn
            ALLOW_HTTP_ADMIN_ORIGIN: '1'
            DATABASE_PATH: /app/data/qqfeiche.sqlite
        volumes:
            - sqlite-data:/app/data

networks:
    gateway-net:
        external: true
        name: gateway-net

volumes:
    sqlite-data:
