storeDir: .pnpm-store

packages:
  - apps/*

catalog:
  # 前端公共依赖（client / admin）
  vue: ^3.5.45
  vue-router: ^5.4.0
  pinia: ^4.1.0
  element-plus: ^2.14.8
  vite: ^8.3.6
  vue-tsc: ^3.3.14
  "@vitejs/plugin-vue": ^6.0.10
  sass-embedded: ^1.108.1
  unplugin-auto-import: ^21.1.0
  unplugin-vue-components: ^32.1.0
  "@coderjc/theme-kit": ^0.2.0
  # 图标（client / admin 共用同一方案）
  "@iconify/vue": ^5.0.5
  "@iconify-json/ep": ^1.2.4
  # 全部项目共用
  typescript: ^6.0.3
  "@types/node": ^26.6.6

allowBuilds:
  '@parcel/watcher': set this to true or false
